x-common-env: &common-env
  DATABASE_URL: postgres://markettg:markettg@postgres:5432/markettg?sslmode=disable
  REDIS_ADDR: redis:6379
  ENVIRONMENT: development
  LOG_LEVEL: info

x-go-service: &go-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  networks:
    - markettg

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: markettg
      POSTGRES_PASSWORD: markettg
      POSTGRES_DB: markettg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markettg"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - markettg

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - markettg

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - markettg

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/catalog --ignore-existing;
      mc anonymous set download local/catalog;
      exit 0;
      "
    networks:
      - markettg

  migrate:
    image: postgres:16-alpine
    volumes:
      - ./migrations:/migrations
    environment:
      PGPASSWORD: markettg
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -h postgres -U markettg -d markettg -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"
        if psql -h postgres -U markettg -d markettg -tAc "SELECT 1 FROM information_schema.schemata WHERE schema_name='users'" | grep -q 1; then
          if [ "$$(psql -h postgres -U markettg -d markettg -tAc "SELECT COUNT(*) FROM public.schema_migrations")" = "0" ]; then
            for name in 000001_init_users.up.sql 000002_init_catalog.up.sql 000003_init_orders.up.sql 000004_init_payments.up.sql 000005_init_delivery.up.sql 000006_init_notifications.up.sql 000007_seed_data.up.sql 000008_seed_admin.up.sql; do
              psql -h postgres -U markettg -d markettg -c "INSERT INTO public.schema_migrations (filename) VALUES ('$$name') ON CONFLICT DO NOTHING"
            done
          fi
        fi
        for f in /migrations/*_*.up.sql; do
          name=$$(basename "$$f")
          if psql -h postgres -U markettg -d markettg -tAc "SELECT 1 FROM public.schema_migrations WHERE filename='$$name'" | grep -q 1; then
            echo "skip $$name"
            continue
          fi
          echo "applying $$f"
          psql -h postgres -U markettg -d markettg -v ON_ERROR_STOP=1 -f "$$f"
          psql -h postgres -U markettg -d markettg -c "INSERT INTO public.schema_migrations (filename) VALUES ('$$name')"
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - markettg

  gateway:
    <<: *go-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/gateway
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      PORT: "8080"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-bot-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-admin-jwt-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      DELIVERY_SERVICE_URL: http://delivery-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  user-service:
    <<: *go-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/user-service
    environment:
      <<: *common-env
      PORT: "8081"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-bot-secret}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-admin-jwt-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  catalog-service:
    <<: *go-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/catalog-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      PORT: "8082"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-bot-secret}
      STAR_KOPECKS_RATE: ${STAR_KOPECKS_RATE:-180}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: catalog
      S3_PUBLIC_URL: http://localhost:9000/catalog
      S3_USE_SSL: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "8082:8082"

  order-service:
    <<: *go-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/order-service
    environment:
      <<: *common-env
      PORT: "8083"
      CATALOG_SERVICE_URL: http://catalog-service:8082
      USER_SERVICE_URL: http://user-service:8081
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-bot-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  payment-service:
    <<: *go-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/payment-service
    environment:
      <<: *common-env
      PORT: "8084"
      ORDER_SERVICE_URL: http://order-service:8083
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      STAR_KOPECKS_RATE: ${STAR_KOPECKS_RATE:-180}
      STARS_MARKUP_PERCENT: ${STARS_MARKUP_PERCENT:-0}
      SBP_MOCK_MODE: ${SBP_MOCK_MODE:-true}
      SBP_WEBHOOK_SECRET: ${SBP_WEBHOOK_SECRET:-dev-sbp-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  delivery-service:
    <<: *go-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/delivery-service
    environment:
      <<: *common-env
      PORT: "8085"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GIFT_PAY_FOR_UPGRADE: ${GIFT_PAY_FOR_UPGRADE:-false}
      GIFT_NOTIFY_USER: ${GIFT_NOTIFY_USER:-true}
      FRAGMENT_API_URL: ${FRAGMENT_API_URL:-}
      FRAGMENT_API_TOKEN: ${FRAGMENT_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  notification-service:
    <<: *go-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_PATH: services/notification-service
    environment:
      <<: *common-env
      PORT: "8086"
      BOT_SERVICE_URL: ${BOT_SERVICE_URL:-http://host.docker.internal:8090}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-bot-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GATEWAY_URL: http://gateway:8080
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-bot-secret}
      MINI_APP_URL: ${MINI_APP_URL:-http://localhost:3000}
      SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL:-https://t.me/markettg_support}
      CATALOG_SERVICE_URL: http://catalog-service:8082
      GIFTS_SYNC_INTERVAL_SEC: ${GIFTS_SYNC_INTERVAL_SEC:-600}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
    ports:
      - "8090:8090"
    networks:
      - markettg

  mini-app:
    build:
      context: ./apps/mini-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      API_URL: http://gateway:8080
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SUPPORT_URL: ${NEXT_PUBLIC_SUPPORT_URL:-https://t.me/markettg_support}
    ports:
      - "3000:3000"
    networks:
      - markettg

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3001:3000"
    networks:
      - markettg

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - markettg

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - markettg

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - markettg

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    volumes:
      - ./infrastructure/loki/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - markettg

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - gateway
      - mini-app
      - admin
      - minio
    networks:
      - markettg

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  caddy_data:

networks:
  markettg:
    driver: bridge
